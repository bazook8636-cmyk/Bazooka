<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ولاد شعبان هندي | شات الزبائن المباشر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- واجهة شات الزبون -->
    <div class="flex-1 max-w-xl w-full mx-auto flex flex-col justify-between space-y-4 my-2">
        <header class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl flex items-center justify-between shadow">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-amber-500 text-slate-950 font-black rounded-xl flex items-center justify-center text-base">ش</div>
                <div>
                    <h2 class="font-bold text-sm leading-tight">محل ولاد شعبان هندي</h2>
                    <p class="text-[10px] text-amber-400">قومية وكمبيالات السيارات والموتوسيكلات</p>
                </div>
            </div>
            <div class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/20 font-bold">
                <i class="fa-solid fa-circle text-[8px] ml-1 animate-pulse"></i> متصل الآن
            </div>
        </header>

        <div id="chat-box" class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 overflow-y-auto chat-scroll min-h-[50vh] max-h-[60vh]">
            <div class="text-center text-slate-500 text-xs py-10">أهلاً بك! ابدأ بإرسال رسالتك أو طلبك للمحل، وهيوصلنا فوراً...</div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2 shadow-xl">
            <!-- تسجيل اسم الزبون الأول عشان يوصلك في رسالة البوت -->
            <div id="client-name-box" class="flex gap-2 pb-1 border-b border-slate-800">
                <input type="text" id="client-name-input" placeholder="اكتب اسمك أو رقمك هنا الأول..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-amber-500">
                <button onclick="saveClientName()" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">حفظ الاسم</button>
            </div>

            <div class="flex items-center gap-2">
                <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-white" disabled>
                <button onclick="sendTextMessage()" id="send-btn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-xl text-xs transition shadow opacity-50 cursor-not-allowed" disabled>إرسال</button>
            </div>
            <p id="status-note" class="text-[10px] text-amber-400 text-center">أدخل اسمك أولاً لتتمكن من مراسلة المحل</p>
        </div>
    </div>

    <script>
        // بيانات بوت التيليجرام الخاصة بك
        const TELEGRAM_BOT_TOKEN = "9092607150:AAH5MMRWqawNYQlyQ6mSKE2zzniF3mrLgmw"; 
        const TELEGRAM_CHAT_ID = "6402034749";

        let clientName = localStorage.getItem('shaban_client_name') || '';

        window.onload = () => {
            if(clientName) {
                document.getElementById('client-name-input').value = clientName;
                enableChat();
            }
            renderMessages();
        };

        function saveClientName() {
            const nameInput = document.getElementById('client-name-input').value.trim();
            if(!nameInput) {
                alert('اكتب اسمك يا أسطى الأول!');
                return;
            }
            clientName = nameInput;
            localStorage.setItem('shaban_client_name', clientName);
            enableChat();
            alert('تم حفظ اسمك، تقدر تبعت رسايلك دلوقتي!');
        }

        function enableChat() {
            document.getElementById('chat-input').removeAttribute('disabled');
            document.getElementById('send-btn').removeAttribute('disabled');
            document.getElementById('send-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('status-note').innerText = 'متصل بالمحل عبر البوت ✅';
        }

        function getMessages() {
            return JSON.parse(localStorage.getItem('shaban_bot_chat') || '[]');
        }

        function saveMessages(msgs) {
            localStorage.setItem('shaban_bot_chat', JSON.stringify(msgs));
        }

        function renderMessages() {
            const box = document.getElementById('chat-box');
            let msgs = getMessages();
            
            if(msgs.length === 0) {
                box.innerHTML = `<div class="text-center text-slate-500 text-xs py-10">أهلاً بك يا ${clientName || 'زائرنا الكريم'}! ابدأ بإرسال رسالتك للمحل...</div>`;
                return;
            }

            box.innerHTML = msgs.map(m => `
                <div class="flex ${m.sender === 'client' ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[85%] p-3 rounded-2xl text-xs space-y-1 ${m.sender === 'client' ? 'bg-amber-600 text-slate-950 font-bold rounded-tr-none' : 'bg-slate-800 text-white rounded-tl-none border border-amber-500/30'}">
                        <div class="text-[9px] opacity-75">${m.sender === 'client' ? clientName : 'ولاد شعبان هندي'} • ${m.time}</div>
                        <p class="text-sm">${m.content}</p>
                    </div>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function sendTextMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt) return;
            if(!clientName) {
                alert('من فضلك ادخل اسمك فوق الأول!');
                return;
            }

            let timeStr = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
            
            let msgs = getMessages();
            msgs.push({ sender: 'client', content: txt, time: timeStr });
            saveMessages(msgs);
            input.value = '';
            renderMessages();

            // إرسال الإشعار للبوت على تيليجرام
            const telegramMessage = `🚨 رسالة جديدة من زبون!\n👤 الاسم: ${clientName}\n💬 الرسالة: ${txt}\n⏰ الوقت: ${timeStr}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: telegramMessage
                    })
                });
            } catch (error) {
                console.error("خطأ في إرسال التنبيه للبوت:", error);
            }
        }
    </script>
</body>
</html>
