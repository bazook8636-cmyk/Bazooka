
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صراحة VIP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(circle at top,#3b0808,#080808 65%);
 color:white;font-family:Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 padding:20px
}
.app{
 width:100%;max-width:430px;
 background:#151515;border:1px solid #9d1717;
 border-radius:22px;padding:25px;
 text-align:center;box-shadow:0 0 30px #65000080
}
h1{color:#ff3030;font-size:32px}
.subtitle{color:#aaa}
.number{
 font-size:65px;font-weight:bold;color:#ff3030;
 margin:20px
}
.question{
 background:#242424;border:1px solid #711515;
 border-radius:15px;padding:25px;
 min-height:120px;display:flex;
 justify-content:center;align-items:center;
 font-size:21px;line-height:1.7
}
button{
 width:100%;padding:15px;margin-top:15px;
 border:0;border-radius:12px;
 background:#b31313;color:white;
 font-size:18px;font-weight:bold
}
button:active{transform:scale(.97)}
input{
 width:100%;padding:14px;margin-top:15px;
 border-radius:10px;border:1px solid #777;
 background:#222;color:white;font-size:18px;
 text-align:center
}
.small{font-size:12px;color:#888;margin-top:20px}
</style>
</head>
<body>
<div class="app">
 <h1>🔥 صراحة VIP 🔥</h1>
 <div class="subtitle">اختار رقم واكتشف سؤالك</div>

 <div class="number" id="number">000</div>
 <div class="question" id="question">
 اضغط على زر ابدأ اللعبة
 </div>

 <button onclick="randomQuestion()">🎲 سؤال عشوائي</button>

 <input id="manual" type="number"
 min="1" max="430" placeholder="اكتب رقم من 1 إلى 430">

 <button onclick="chooseNumber()">اختيار الرقم</button>
 <button onclick="copyQuestion()">📋 نسخ السؤال</button>

 <div class="small">BAZOOKA VIP • صراحة بدون حدود</div>
</div>

<script>
const questions = [
"إيه أكتر سر مخبيه عن الناس؟",
"مين أكتر شخص بتثق فيه؟",
"هل ندمت على معرفة شخص؟",
"إيه أكبر كذبة قلتها؟",
"مين آخر شخص جه في بالك؟",
"إيه أكتر موقف محرج حصلك؟",
"هل سامحت شخص ومش قادر تنسى؟",
"إيه أكتر حاجة نفسك تحققها؟",
"مين الشخص اللي نفسك تكلمه دلوقتي؟",
"هل بتثق في الناس بسهولة؟",
"إيه أكتر حاجة بتخاف تخسرها؟",
"لو رجع بيك الزمن هتغير إيه؟",
"مين أكتر شخص أثر في حياتك؟",
"هل بتخبي زعلك عن الناس؟",
"إيه الحاجة اللي محدش يعرفها عنك؟",
"هل حكمت على شخص وطلعت غلطان؟",
"مين أكتر شخص بيضحكك؟",
"إيه أصعب قرار أخدته؟",
"هل عندك حلم خايف تحكيه؟",
"إيه أكتر صفة بتحبها في نفسك؟",
"مين الشخص اللي نفسك تشوفه؟",
"هل بتسامح بسرعة؟",
"إيه أكتر حاجة بتضايقك؟",
"لو معاك فرصة تبدأ من جديد هتعمل إيه؟",
"إيه أكتر ذكرى مش بتنساها؟",
"هل بتحب تكون لوحدك؟",
"مين أكتر شخص فاهمك؟",
"إيه الحاجة اللي نفسك تقولها ومش قادر؟",
"هل عمرك غيرت رأيك في شخص؟",
"إيه أكبر درس اتعلمته؟"
];

function getQuestion(n){
 return questions[(n-1)%questions.length];
}

function showQuestion(n){
 document.getElementById("number").textContent=n;
 document.getElementById("question").textContent=getQuestion(n);
}

function randomQuestion(){
 const n=Math.floor(Math.random()*430)+1;
 showQuestion(n);
}

function chooseNumber(){
 const n=Number(document.getElementById("manual").value);
 if(n<1||n>430||!Number.isInteger(n)){
  alert("اكتب رقم صحيح من 1 إلى 430");
  return;
 }
 showQuestion(n);
}

function copyQuestion(){
 const q=document.getElementById("question").textContent;
 if(navigator.clipboard){
  navigator.clipboard.writeText(q)
   .then(()=>alert("تم نسخ السؤال"));
 }else{
  alert(q);
 }
}
</script>
</body>
</html>
